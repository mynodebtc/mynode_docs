name: Build and Deploy
on:
  push:
    branches:
      - master

# The job only needs to read the repository. Deploying uses the SSH key, not
# the GitHub token.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before the build because `vuepress build` executes any <script>
      # block found in a Markdown file during server-side rendering. Checking
      # first means unsafe content stops the job instead of running in it.
      - name: Check Markdown for executable content 🔍
        run: node scripts/check-markdown.js

      # Pinned so a runner-image Node bump can't silently break the
      # webpack 4 / --openssl-legacy-provider build. 22 is what
      # ubuntu-24.04 shipped when this was pinned and what deploys had
      # been building on.
      - name: Set up Node 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install and Build 🔧
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          # --frozen-lockfile: install exactly the tree pinned in yarn.lock
          #   (every entry carries an integrity hash) and fail if package.json
          #   and the lockfile have drifted apart. The previous `npm install`
          #   ignored yarn.lock entirely and re-resolved every ^ range on each
          #   deploy, so any new release in the tree shipped straight to prod.
          # --ignore-scripts: the only install hooks in this tree are core-js
          #   and vuepress funding notices; neither is needed to build.
          yarn install --frozen-lockfile --ignore-scripts
          # docs:build runs scripts/check-templates.js first, so a page with
          # tags or attributes outside its allowlist stops the job before
          # vuepress build runs anything from it.
          yarn docs:build

      - name: Deploy 🚀
        env:
          SSH_HOST: ${{ secrets.DOCS_SSH_HOST }}
          SSH_PORT: ${{ secrets.DOCS_SSH_PORT }}
          SSH_USER: ${{ secrets.DOCS_SSH_USER }}
          SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          REMOTE_PATH: ${{ secrets.DOCS_REMOTE_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null

          # SFTP, not rsync: the server gives this key an SFTP session and
          # nothing else, so it cannot be used to run a program there (rsync
          # over ssh starts one). lftp's mirror is the rsync --delete
          # equivalent: it uploads the build and removes anything on the
          # server that is not in it. --transfer-all uploads every file every
          # time: without it lftp skips a file whose size did not change
          # unless the local copy looks newer, and a one-character edit keeps
          # the size. use-temp-file uploads under a temporary name and renames,
          # so a visitor never gets half a file.
          command -v lftp > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; }
          lftp -c "
            set cmd:fail-exit yes
            set net:max-retries 2
            set xfer:use-temp-file yes
            set sftp:auto-confirm no
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes'
            open -u '$SSH_USER,' -p '$SSH_PORT' 'sftp://$SSH_HOST'
            mirror --reverse --delete --transfer-all --parallel=4 --verbose docs/.vuepress/dist/ '$REMOTE_PATH/'
          "
